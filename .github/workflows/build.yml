name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install esbuild and build plugin
        run: |
          npm install --no-save --ignore-scripts --legacy-peer-deps esbuild@^0.28.2
          npm run build

      - name: Run team-settings tests
        run: |
          npm install --no-save --ignore-scripts --legacy-peer-deps vitest@^3
          npx vitest run tests/team-settings.spec.ts

      - name: Upload plugin bundles
        uses: actions/upload-artifact@v4
        with:
          name: plugin-lib
          path: |
            lib/
          if-no-files-found: error

  desktop:
    name: Desktop build (native Rust / NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: native -> target

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build native client (release)
        working-directory: native
        run: cargo build --release -p dsh-client

      - name: Build NSIS installer
        working-directory: native
        shell: pwsh
        run: |
          $makensis = Get-ChildItem "C:\Program Files (x86)\NSIS\makensis.exe" -ErrorAction Stop
          & $makensis.FullName installer\installer.nsi

      - name: Generate checksums
        shell: pwsh
        run: |
          $sums = @()
          $sums += (Get-FileHash native\target\release\dsh-client.exe -Algorithm SHA256).Hash + "  dsh-client.exe"
          $sums += (Get-FileHash native\target\release\dsh-client-setup.exe -Algorithm SHA256).Hash + "  dsh-client-setup.exe"
          $sums | Set-Content native\target\release\SHA256SUMS.txt -Encoding ascii

      - name: Upload desktop executable
        uses: actions/upload-artifact@v4
        with:
          name: dsh-client-exe
          path: native/target/release/dsh-client.exe
          if-no-files-found: error

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: dsh-client-installer
          path: |
            native/target/release/dsh-client-setup.exe
            native/target/release/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plugin, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: dsh-client-installer
          path: artifacts/installer

      - name: Download executable artifact
        uses: actions/download-artifact@v4
        with:
          name: dsh-client-exe
          path: artifacts/exe

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/installer/*
            artifacts/exe/*
