name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install esbuild and build plugin
        run: |
          npm install --no-save --ignore-scripts --legacy-peer-deps esbuild@^0.28.2
          npm run build

      - name: Run team-settings tests
        run: |
          npm install --no-save --ignore-scripts --legacy-peer-deps vitest@^3
          npx vitest run tests/team-settings.spec.ts

      - name: Upload plugin bundles
        uses: actions/upload-artifact@v4
        with:
          name: plugin-lib
          path: |
            lib/
          if-no-files-found: error

  desktop:
    name: Desktop build (Tauri / NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop app and NSIS installer
        run: npm run desktop:build

      - name: Generate installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer not found' }
          (Get-FileHash $installer.FullName -Algorithm SHA256).Hash | Set-Content desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt -Encoding ascii

      - name: Upload desktop executable
        uses: actions/upload-artifact@v4
        with:
          name: tmd-desktop-exe
          path: desktop/src-tauri/target/release/tmd-desktop.exe
          if-no-files-found: error

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: tmd-desktop-installer
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plugin, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: tmd-desktop-installer
          path: artifacts/installer

      - name: Download executable artifact
        uses: actions/download-artifact@v4
        with:
          name: tmd-desktop-exe
          path: artifacts/exe

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/installer/*
            artifacts/exe/*
