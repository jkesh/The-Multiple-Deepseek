[package]
name = "tmd-desktop"
version = "0.1.0"
description = "Desktop shell for DeepSeek Harness and The-Multiple-Deepseek"
authors = ["jkesh"]
edition = "2021"

[lib]
name = "tmd_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
url = "2"
