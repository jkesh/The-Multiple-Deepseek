<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DeepSeek Harness</title>
<style>:root{color-scheme:light dark;font-family:Inter,"Segoe UI",sans-serif;background:#f7f8fa;color:#16181d}@media(prefers-color-scheme:dark){:root{background:#17181c;color:#f2f3f5}}body{min-height:100vh;margin:0;display:grid;place-items:center}main{width:min(440px,calc(100vw - 40px))}h1{margin:0 0 8px;font-size:24px;line-height:32px;letter-spacing:0}p{margin:0;color:#747983;font-size:14px;line-height:22px}.progress{height:3px;margin-top:24px;overflow:hidden;background:rgba(127,127,127,.2)}.progress::after{content:"";display:block;width:36%;height:100%;background:#1469d4;animation:loading 1.1s ease-in-out infinite}.error{display:none;margin-top:18px;color:#c73535;white-space:pre-wrap}button{display:none;margin-top:16px;min-height:34px;border:1px solid rgba(127,127,127,.35);border-radius:6px;padding:6px 14px;background:transparent;color:inherit;cursor:pointer}@keyframes loading{from{transform:translateX(-120%)}to{transform:translateX(360%)}}</style></head>
<body><main><h1>DeepSeek Harness</h1><p id="status">正在连接本机 DSH 服务...</p><div id="progress" class="progress"></div><p id="error" class="error" role="alert"></p><button id="retry" type="button">重试</button></main>
<script>const invoke=window.__TAURI_INTERNALS__.invoke;const status=document.querySelector('#status');const error=document.querySelector('#error');const retry=document.querySelector('#retry');const progress=document.querySelector('#progress');async function launch(){status.textContent='正在连接本机 DSH 服务...';error.style.display='none';retry.style.display='none';progress.style.display='block';try{await invoke('launch_dsh')}catch(reason){status.textContent='无法启动 DeepSeek Harness';error.textContent=String(reason);error.style.display='block';retry.style.display='inline-flex';progress.style.display='none'}}retry.addEventListener('click',launch);launch();</script></body></html>
