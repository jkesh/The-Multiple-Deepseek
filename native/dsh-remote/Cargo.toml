[package]
name = "dsh-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dependency-light Rust client for the DeepSeek Harness web API"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "dsh-smoke"
path = "src/bin/smoke.rs"

[[bin]]
name = "dsh-chat"
path = "src/bin/chat.rs"

[[bin]]
name = "dsh-healthprobe"
path = "src/bin/healthprobe.rs"
